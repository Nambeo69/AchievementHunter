name: Build Achievement Hunter

on:
  workflow_dispatch:
  push:
    paths:
      - 'achievement-hunter-source.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Extract mod source
        run: |
          mkdir -p work
          unzip achievement-hunter-source.zip -d work

      - name: Build mod
        working-directory: work
        run: gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: achievement-hunter-fabric-1.21
          path: work/build/libs/*.jar
          
